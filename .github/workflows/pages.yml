# Deploy artifacts/ebiz-site to GitHub Pages (static Vite build).
# Required: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "artifacts/ebiz-site/**"
      - "lib/**"
      - "scripts/build-pages.mjs"
      - "scripts/resolve-pages-base.mjs"
      - "scripts/deploy-pages.mjs"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      base_path:
        description: "Vite BASE_PATH override (e.g. / or /Asset-Managerzip/)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PORT: "5173"
      GITHUB_PAGES: "true"
      NODE_ENV: production
      PAGES_REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Pages base path
        id: pages
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.base_path }}" ]; then
            BASE="${{ github.event.inputs.base_path }}"
          elif [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            BASE="${{ vars.PAGES_BASE_PATH }}"
          elif [ -f artifacts/ebiz-site/public/CNAME ] || [ -n "${{ vars.PAGES_CUSTOM_DOMAIN }}" ]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          BASE_PATH=$(node --input-type=module -e "import { normalizeBasePath } from './scripts/resolve-pages-base.mjs'; console.log(normalizeBasePath(process.argv[1]));" "$BASE")
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build NorthSouth site
        run: pnpm run build:pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

      - name: Verify build output
        run: |
          test -f artifacts/ebiz-site/dist/public/index.html
          test -f artifacts/ebiz-site/dist/public/404.html
          test -f artifacts/ebiz-site/dist/public/.nojekyll
          echo "Deploying static site from artifacts/ebiz-site/dist/public"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ebiz-site/dist/public

      - id: deployment
        uses: actions/deploy-pages@v4

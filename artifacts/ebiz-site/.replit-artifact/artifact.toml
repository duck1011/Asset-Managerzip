kind = "web"
previewPath = "/"
title = "E-Business Website"
version = "1.0.0"
id = "artifacts/ebiz-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21389

[services.development]
run = "pnpm --filter @workspace/ebiz-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ebiz-site", "run", "build" ]
publicDir = "artifacts/ebiz-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21389"
BASE_PATH = "/"
